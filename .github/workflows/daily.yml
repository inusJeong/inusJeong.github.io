# 매일 아침: 구독자 전원에게 맞춤 리포트를 만들어 카카오톡으로 발송
#   수집·묶기·본문 보강은 전체 1회, 고르기·요약·발송은 사람마다 (newsbot/multi.py)
#   리포트 페이지는 Vercel(SITE_URL)에서 열리므로 여기서 배포할 것은 없다
name: daily-report

on:
  schedule:
    - cron: "30 21 * * *"   # 매일 06:30 KST (GitHub 스케줄은 10~30분 늦게 시작되는 경우가 많음)
  workflow_dispatch:
    inputs:
      force:
        description: "오늘 이미 보낸 사람에게도 다시 보내기"
        type: boolean
        default: false

concurrency:
  group: daily-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
      NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
      KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
      KAKAO_CLIENT_SECRET: ${{ secrets.KAKAO_CLIENT_SECRET }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      SITE_URL: ${{ secrets.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 구독자 전원 발송
        run: python -m newsbot run-users ${{ inputs.force && '--force' || '' }}
